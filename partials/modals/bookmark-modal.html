<div id="bookmark-modal" class="modal">
        <div class="modal-content bookmark-modal-content">
            <div class="modal-header">
                <div class="modal-header-left">
                    <button id="back-to-manual" class="modal-back-btn" style="display:none;" aria-label="Back">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <h2 id="modal-title">Add Bookmark</h2>
                </div>
                <span id="close-modal-btn" class="close"><i class="fa-solid fa-xmark"></i></span>
            </div>

            <div class="modal-body">
                <!-- Manual Entry Form -->
                <div id="manual-entry-form" class="bookmark-modal-form">
                    <div class="modal-input-group">
                        <i class="fa-solid fa-tag modal-input-icon"></i>
                        <input type="text" id="bookmark-title" class="i18n-placeholder"
                            data-i18n-placeholder="modal_title_placeholder" placeholder="Title">
                    </div>
                    <div class="modal-input-group">
                        <i class="fa-solid fa-link modal-input-icon"></i>
                        <input type="url" id="bookmark-url" class="i18n-placeholder"
                            data-i18n-placeholder="modal_url_placeholder" placeholder="URL (e.g., https://example.com)">
                    </div>
                    <div class="modal-input-group">
                        <i class="fa-solid fa-image modal-input-icon"></i>
                        <input type="url" id="bookmark-icon-url" class="i18n-placeholder"
                            data-i18n-placeholder="modal_icon_placeholder" placeholder="Custom Icon URL (Optional)">
                    </div>
                    <div class="modal-actions" style="display: flex; gap: 12px; margin-top: 15px;">
                        <button id="save-bookmark" class="primary-btn"
                            style="flex: 1 1 0; width: 0; height: 44px; justify-content: center; gap: 10px; font-weight: 600;">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span data-i18n="modal_save">Save</span>
                        </button>
                        <button id="show-import-btn" class="secondary-btn modal-import-trigger-btn"
                            style="flex: 1 1 0; width: 0; height: 44px; justify-content: center; gap: 10px; font-weight: 600;">
                            <i class="fa-solid fa-download"></i>
                            <span data-i18n="modal_import">Import from Browser</span>
                        </button>
                    </div>
                </div>

                <!-- Import Section (Hidden by default) -->
                <div id="import-section" style="display: none;">
                    <div class="import-toolbar">
                        <div class="import-search-wrap">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="import-search" class="import-search-input"
                                data-i18n-placeholder="modal_import_search" placeholder="Search bookmarks...">
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <button id="import-toggle-folders-btn" class="secondary-btn"
                                style="padding: 4px 8px; font-size: 0.85rem;" data-i18n-title="modal_toggle_folders"
                                title="Toggle Folders">
                                <i class="fa-solid fa-folder-tree"></i>
                            </button>
                            <label class="import-select-all-label" for="import-select-all">
                                <input type="checkbox" id="import-select-all">
                                <span data-i18n="modal_select_all">Select all</span>
                            </label>
                        </div>
                    </div>
                    <div id="browser-bookmarks-list" class="bookmark-tree-container"></div>
                    <div class="import-footer"
                        style="display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08);">
                        <span id="import-count-label" class="import-count-label"
                            style="font-size: 0.9rem; opacity: 0.8; font-weight: 500;">0 selected</span>
                        <button id="confirm-import-btn" class="primary-btn"
                            style="height: 40px; padding: 0 20px; justify-content: center; gap: 10px; font-weight: 600; min-width: 160px;">
                            <i class="fa-solid fa-file-import"></i>
                            <span data-i18n="modal_import_selected">Import Selected</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
