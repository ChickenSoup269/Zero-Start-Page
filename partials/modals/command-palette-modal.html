<!-- Command Palette Modal -->
    <div id="command-palette-modal" class="bug-modal">
        <div class="bug-modal-content" style="max-width: 500px;">
            <div class="bug-modal-header">
                <h2 data-i18n="command_palette_title"><i class="fa-solid fa-keyboard" style="margin-right: 8px;"></i>
                    Lệnh Nhanh</h2>
                <span id="close-command-palette-btn" class="close"><i class="fa-solid fa-xmark"></i></span>
            </div>
            <div class="bug-modal-body">
                <div class="modal-input-group" style="margin-bottom: 15px;">
                    <i class="fa-solid fa-magnifying-glass modal-input-icon"></i>
                    <input type="text" id="command-palette-search" data-i18n-placeholder="command_palette_placeholder"
                        placeholder="Tìm kiếm lệnh... (Ví dụ: hình nền, thời tiết)" class="full-width"
                        style="margin: 0;" autocomplete="off">
                </div>
                <div id="command-palette-list" class="command-palette-list">
                    <!-- Commands injected here -->
                </div>
            </div>
            <div class="bug-modal-footer" style="justify-content: center; opacity: 0.7; font-size: 0.85em;">
                <span>
                    <span data-i18n="cp_footer_use">Sử dụng</span>
                    <kbd>↑</kbd> <kbd>↓</kbd>
                    <span data-i18n="cp_footer_navigate">để di chuyển</span>,
                    <kbd>Enter</kbd>
                    <span data-i18n="cp_footer_select">để chọn</span>
                    ·
                    <span data-i18n="cp_footer_press">bấm</span>
                    <i class="fa-solid fa-pen"></i>
                    <span data-i18n="cp_footer_edit">để sửa phím tắt</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Command Palette Onboarding Tooltip -->
    <div id="command-palette-tooltip" class="command-palette-tooltip">
        <div class="tooltip-content">
            <i class="fa-solid fa-lightbulb" style="color: #FFD43B; margin-right: 8px;"></i>
            <span>
                <span data-i18n="cp_tooltip_press">Bấm</span>
                <kbd>Ctrl</kbd> + <kbd>K</kbd>
                <span data-i18n="cp_tooltip_open">để mở nhanh các lối tắt</span>
            </span>
        </div>
        <button id="close-cp-tooltip" class="close-tooltip-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
