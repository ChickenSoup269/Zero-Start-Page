<div class="settings-section" data-section-id="font" data-settings-tab="appearance">
    <h3 class="section-toggle" data-i18n="settings_font"><i class="fa-solid fa-font"></i> Font <span
            id="font-count-display" class="section-count"></span></h3>
    <div class="section-content">
        <div class="setting-group">
            <div class="font-target-wrapper">
                <div class="font-target-toggles">
                    <button id="font-target-general-btn" class="font-target-btn active" data-i18n="general_font">General
                        Font</button>
                    <button id="font-target-clock-btn" class="font-target-btn" data-i18n="clock_font">Clock
                        Font</button>
                    <button id="font-target-both-btn" class="font-target-btn" data-i18n="both_fonts">Both</button>
                    <select id="font-target-select" style="display: none;">
                        <option value="general">General</option>
                        <option value="clock">Clock</option>
                        <option value="both">Both</option>
                    </select>
                </div>
                <button id="font-select-mode-btn" class="settings-action-btn" data-i18n="settings_select_fonts"
                    style="display:none;">Select</button>
            </div>
            <div id="font-select-toolbar" class="bg-select-toolbar" style="display: none;">
                <span id="font-select-count" class="bg-select-count">0 selected</span>
                <div class="bg-select-actions">
                    <button id="font-select-all-btn" class="bg-select-btn" title="Select All"
                        data-i18n-title="select_all"><i class="fa-solid fa-check-double"></i></button>
                    <button id="font-favorite-selected-btn" class="bg-select-btn" title="Favorite"
                        data-i18n-title="menu_favorite"><i class="fa-solid fa-star"></i></button>
                    <button id="font-delete-selected-btn" class="bg-select-btn danger" title="Delete"
                        data-i18n-title="menu_delete"><i class="fa-solid fa-trash"></i></button>
                    <button id="font-select-cancel-btn" class="bg-select-btn" title="Cancel" data-i18n-title="cancel"><i
                            class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div style="margin-bottom: 0.75rem;">
                <input type="text" id="font-search-input" data-i18n-placeholder="search" placeholder="Search fonts..."
                    class="font-search-input" />
            </div>
            <div id="font-grid" class="font-grid"></div>
            <small class="setting-hint" data-i18n="settings_font_restriction_note"
                style="margin-top: 0.75rem; display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-circle-info"></i> Note: Some custom fonts (Electroharmonix, Anurati,
                Reiko, Aquire, Blanka, etc.) only apply to Clock & Date.
            </small>
        </div>

        <div class="setting-group">
            <label data-i18n="settings_custom_font" for="custom-font-input"><i class="fa-solid fa-font"></i> Custom
                Google Font</label>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <input type="text" id="custom-font-input" data-i18n-placeholder="settings_custom_font_placeholder"
                    placeholder="Enter font name (e.g., Pacifico)" class="custom-font-input" />
                <div class="custom-font-btn-row">
                    <button id="load-custom-font-btn" class="custom-font-action-btn custom-font-load-btn"
                        data-i18n="settings_load_font">
                        <i class="fa-solid fa-cloud-arrow-down"></i>
                        <span>Load</span>
                    </button>
                    <button id="save-font-btn" class="custom-font-action-btn custom-font-save-btn"
                        data-i18n="settings_save_font">
                        <i class="fa-solid fa-bookmark"></i>
                        <span>Save</span>
                    </button>
                </div>
            </div>
            <small class="setting-hint" data-i18n="settings_custom_font_hint">Enter exact font name from Google
                Fonts</small>

            <div id="saved-fonts-container" style="margin-top: 0.75rem; display: none;">
                <div data-i18n="settings_saved_fonts" class="setting-label">Saved Fonts</div>
                <div id="saved-fonts-list" class="saved-fonts-list-wrap"></div>
            </div>

            <small class="setting-hint" style="margin-top: 12px; display: block;">
                <a href="https://fonts.google.com/" target="_blank" rel="noopener" style="color: white;"
                    data-i18n="settings_google_fonts_info">Get any google font here
                </a>
            </small>
        </div>

        <div class="setting-group">
            <div class="setting-label"><i class="fa-solid fa-laptop-code"></i> <span
                    data-i18n="settings_local_fonts">Browse Local Fonts</span></div>
            <button id="browse-local-fonts-btn" class="browse-local-fonts-action-btn browse-local-fonts-btn-styled"
                data-i18n="settings_local_fonts">
                <i class="fa-solid fa-laptop-code"></i> Browse Local Fonts
            </button>
            <p class="setting-hint" data-i18n="settings_local_fonts_hint">Use fonts installed on your computer</p>
        </div>
    </div>
</div>
