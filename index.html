<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Start Page</title>
    <link id="tab-favicon" rel="icon" type="image/png" href="icon/logo.png">
    <link rel="apple-touch-icon" href="icon/logo.png">
    <!-- Google Fonts:  Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link id="custom-google-font" rel="stylesheet" href="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Modular Styles -->
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/base.css?v=3">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/widgets.css?v=2" />
    <link rel="stylesheet" href="styles/quotes.css" />
    <link rel="stylesheet" href="styles/settings.css" />
    <link rel="stylesheet" href="styles/music-player.css?v=4">
    <link rel="stylesheet" href="styles/dialog.css">
    <link rel="stylesheet" href="styles/rss.css">
    <link rel="stylesheet" href="styles/white-access-mode.css">
</head>

<body class="loading-state">
    <script src="src/preload.js"></script>
    <!-- Startup Overlay to prevent any white flashes -->
    <div id="startup-overlay">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
        <div class="startup-content">
            <div class="startup-logo">Zero Startpage</div>
            <div class="startup-loader">
                <div class="loader-bar"></div>
            </div>
            <div id="startup-version" class="startup-version">v0.0.0</div>
        </div>
    </div>

    <div id="bg-layer"></div>
    <div id="bg-fade-layer" aria-hidden="true"></div>
    <div id="bg-dim-overlay"></div>
    <div id="bg-directional-blur-overlay"></div>

    <!-- Background Effect Canvases (Above dim overlay and background, below UI) -->
    <canvas id="effect-canvas" class="bg-effect-canvas"></canvas>
    <canvas id="gradient-v2-canvas" class="bg-effect-canvas bg-effect-canvas-hidden"></canvas>
    <canvas id="pixel-snow-hq-canvas" class="bg-effect-canvas bg-effect-canvas-hidden"></canvas>
    <canvas id="soft-aurora-canvas" class="bg-effect-canvas bg-effect-canvas-hidden"></canvas>
    <canvas id="silk-canvas" class="bg-effect-canvas bg-effect-canvas-hidden"></canvas>
    <canvas id="light-pillar-canvas" class="bg-effect-canvas bg-effect-canvas-hidden"></canvas>
    <canvas id="liquid-ether-canvas" class="bg-effect-canvas bg-effect-canvas-hidden"></canvas>
    <canvas id="splash-cursor-canvas" class="bg-effect-canvas bg-effect-canvas-hidden"></canvas>

    <!-- Top Right Controls (Google Apps + Avatar) -->
    <div id="top-right-controls" class="top-right-controls">
        <a href="https://about.google/products/" target="_blank" class="top-control-btn google-apps-btn"
            data-i18n-title="google_apps_tooltip" title="Google Apps">
            <i class="fa-solid fa-grip"></i>
        </a>

        <div id="g-apps-dropdown" class="g-apps-dropdown">
            <div class="g-apps-scroll-area">
                <div id="g-apps-dynamic-root"></div>
            </div>
            <a href="https://about.google/products/" target="_blank" class="g-apps-more-btn"
                data-i18n="g_apps_more">More from Google</a>
        </div>
    </div>

    <!-- Side Controls (Settings + Quick Access) -->
    <div class="side-controls">
        <button id="settings-toggle" class="icon-btn" data-i18n-title="settings_title" title="Settings"><i
                class="fa-solid fa-gear"></i></button>
        <div id="quick-access-bar" class="quick-access-bar">
            <button class="quick-btn" data-toggle="todo" data-i18n-title="quick_access_todo" title="Toggle Todo"><i
                    class="fa-solid fa-list-check"></i></button>
            <button class="quick-btn" data-toggle="notepad" data-i18n-title="quick_access_notepad"
                title="Toggle Notepad"><i class="fa-solid fa-note-sticky"></i></button>
            <button class="quick-btn" data-toggle="timer" data-i18n-title="quick_access_timer" title="Toggle Timer"><i
                    class="fa-solid fa-stopwatch"></i></button>
            <button class="quick-btn" data-toggle="calendar" data-i18n-title="quick_access_calendar"
                title="Toggle Calendar"><i class="fa-solid fa-calendar-days"></i></button>
            <button class="quick-btn" data-toggle="quotes" data-i18n-title="quick_access_quotes"
                title="Toggle Quotes"><i class="fa-solid fa-quote-left"></i></button>
            <button class="quick-btn" data-toggle="rss" data-i18n-title="quick_access_rss" title="Toggle RSS Reader"><i
                    class="fa-solid fa-rss"></i></button>
            <button class="quick-btn" data-toggle="habitTracker" data-i18n-title="quick_access_habits"
                title="Toggle Habit Tracker"><i class="fa-solid fa-bars-progress"></i></button>
            <button class="quick-btn" data-toggle="weather" data-i18n-title="quick_access_weather"
                title="Toggle Weather"><i class="fa-solid fa-cloud-sun"></i></button>
            <button class="quick-btn" data-toggle="music" data-toggle-type="layout" data-i18n-title="quick_access_music"
                title="Toggle Music"><i class="fa-solid fa-music"></i></button>
            <button class="quick-btn" data-toggle="clock" data-i18n-title="quick_access_clock" title="Toggle Clock"><i
                    class="fa-solid fa-clock"></i></button>
            <button class="quick-btn" data-toggle="gregorian" data-i18n-title="quick_access_gregorian"
                title="Toggle Gregorian Calendar"><i class="fa-solid fa-calendar-check"></i></button>
            <button id="layout-controls-btn" class="quick-btn" data-i18n-title="quick_layout_title"
                title="Layout Controls"><i class="fa-solid fa-sliders"></i></button>
            <button id="reset-layout-quick" class="quick-btn" data-i18n-title="settings_reset_layout"
                title="Reset Layout"><i class="fa-solid fa-arrows-rotate"></i></button>

            <div class="quick-access-divider"></div>
            <button id="quick-access-collapse" class="quick-btn" title="Collapse"><i
                    class="fa-solid fa-chevron-left"></i></button>
        </div>

        <div data-settings-partial="layout-controls-popup" data-src="partials/controls/layout-controls-popup.html"></div>
    </div>

    <video id="bg-video" autoplay muted loop playsinline></video>

    <!-- Settings Sidebar -->
    <div id="settings-sidebar" class="settings-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-wrap">
                <button id="sidebar-toc-toggle" class="sidebar-toc-btn" data-i18n-title="sidebar_toc"
                    title="Table of Contents">
                    <i class="fa-solid fa-list-ul"></i>
                </button>
                <img src="./icon/logo.png" width="30px" alt="">
                <h2 data-i18n="settings_title"> Settings</h2>
                <span id="settings-version" class="settings-version" aria-label="Extension version"></span>
                <a id="sidebar-update-link"
                    href="https://extension-changelogs.vercel.app/changelog?ext=Zero+Startpage+-+Newtab+Replacement"
                    target="_blank" class="sidebar-update-link" style="display: none;"
                    data-i18n-title="settings_check_updates" title="New update available!">
                    <i class="fa-solid fa-circle-arrow-up"></i>
                </a>
            </div>
            <div class="sidebar-header-actions">
                <button type="button" id="settings-nav-toggle" class="sidebar-nav-toggle-btn"
                    title="Toggle Search & Navigation" data-i18n-title="settings_nav_toggle">
                    <i class="fa-solid fa-chevron-up"></i>
                </button>
                <span id="close-settings" class="close-sidebar"><i class="fa-solid fa-xmark"></i></span>
            </div>
        </div>
        <div id="sidebar-toc-menu" class="sidebar-toc-menu">
            <!-- Dynamically populated ToC items -->
        </div>
        <!-- Settings Search & Tab Navigation -->
        <div class="settings-nav-container">
            <div class="settings-search-wrap">
                <i class="fa-solid fa-magnifying-glass settings-search-icon"></i>
                <input type="text" id="settings-search-input" class="settings-search-input"
                    data-i18n-placeholder="settings_search_placeholder" placeholder="Search settings..."
                    autocomplete="off" spellcheck="false" />
                <button type="button" id="settings-search-clear" class="settings-search-clear-btn"
                    data-i18n-title="settings_search_clear" title="Clear search" aria-label="Clear search" hidden>
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="settings-tab-nav" class="settings-tab-nav" role="tablist">
                <button type="button" class="settings-tab-btn active" data-tab="appearance" role="tab"
                    aria-selected="true">
                    <i class="fa-solid fa-palette"></i>
                    <span data-i18n="settings_tab_appearance">Appearance</span>
                </button>
                <button type="button" class="settings-tab-btn" data-tab="background" role="tab" aria-selected="false">
                    <i class="fa-solid fa-image"></i>
                    <span data-i18n="settings_tab_background">Background</span>
                </button>
                <button type="button" class="settings-tab-btn" data-tab="clock" role="tab" aria-selected="false">
                    <i class="fa-solid fa-clock"></i>
                    <span data-i18n="settings_tab_clock">Clock & Date</span>
                </button>
                <button type="button" class="settings-tab-btn" data-tab="bookmarks" role="tab" aria-selected="false">
                    <i class="fa-solid fa-bookmark"></i>
                    <span data-i18n="settings_tab_bookmarks">Bookmarks</span>
                </button>
                <button type="button" class="settings-tab-btn" data-tab="widgets" role="tab" aria-selected="false">
                    <i class="fa-solid fa-cubes"></i>
                    <span data-i18n="settings_tab_widgets">Widgets</span>
                </button>
                <button type="button" class="settings-tab-btn" data-tab="system" role="tab" aria-selected="false">
                    <i class="fa-solid fa-gear"></i>
                    <span data-i18n="settings_tab_system">System</span>
                </button>
            </div>
            <div class="bg-subtab-nav" id="bg-subtab-nav" data-settings-tab="background" role="tablist">
                <button type="button" class="bg-subtab-btn active" data-bg-subtab="media" role="tab"
                    aria-selected="true">
                    <i class="fa-solid fa-image"></i>
                    <span data-i18n="bg_subtab_media">Media & Photos</span>
                </button>
                <button type="button" class="bg-subtab-btn" data-bg-subtab="colors" role="tab" aria-selected="false">
                    <i class="fa-solid fa-palette"></i>
                    <span data-i18n="bg_subtab_colors">Colors & Gradients</span>
                </button>
                <button type="button" class="bg-subtab-btn" data-bg-subtab="animated" role="tab" aria-selected="false">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span data-i18n="bg_subtab_animated">Live FX</span>
                </button>
                <button type="button" class="bg-subtab-btn" data-bg-subtab="adjust" role="tab" aria-selected="false">
                    <i class="fa-solid fa-sliders"></i>
                    <span data-i18n="bg_subtab_adjust">Adjust & Fit</span>
                </button>
            </div>
        </div>
        <div class="sidebar-content">
            <!-- Search empty state message -->
            <div id="settings-search-empty" class="settings-search-empty" style="display: none;">
                <i class="fa-solid fa-magnifying-glass settings-search-empty-icon"></i>
                <p id="settings-search-empty-text" data-msg-template="No settings matching &quot;{query}&quot;"
                    data-i18n="settings_search_no_results">No settings found</p>
                <button type="button" id="settings-search-empty-reset" class="secondary-btn">
                    <i class="fa-solid fa-rotate-left"></i> <span data-i18n="settings_search_clear">Clear search</span>
                </button>
            </div>
            <div data-settings-partial="language" data-src="partials/settings/language.html"
                data-settings-tab="system"></div>
            <div data-settings-partial="page-title" data-src="partials/settings/page-title.html"
                data-settings-tab="appearance"></div>

            <!-- Theme Selector -->

            <div data-settings-partial="themes" data-src="partials/settings/themes.html" data-settings-tab="appearance">
            </div>

            <div data-settings-partial="background" data-src="partials/settings/background.html"
                data-settings-tab="background"></div>
            <div data-settings-partial="gradient-multi-color" data-src="partials/settings/gradient-multi-color.html"
                data-settings-tab="background">
            </div>
            <div data-settings-partial="animated-backgrounds" data-src="partials/settings/animated-backgrounds.html"
                data-settings-tab="background">
            </div>
            <div data-settings-partial="font" data-src="partials/settings/font.html" data-settings-tab="appearance">
            </div>


            <div data-settings-partial="date-clock" data-src="partials/settings/date-clock.html"
                data-settings-tab="clock"></div>
            <div data-settings-partial="bookmark-custom" data-src="partials/settings/bookmark-custom.html"
                data-settings-tab="bookmarks"></div>
            <div data-settings-partial="custom-title" data-src="partials/settings/custom-title.html"
                data-settings-tab="appearance"></div>

            <div data-settings-partial="layout" data-src="partials/settings/layout.html" data-settings-tab="widgets">
            </div>
            <!-- Data & Sync Section -->
            <div data-settings-partial="data-sync" data-src="partials/settings/data-sync.html"
                data-settings-tab="system"></div>

            <!-- About Project Section -->
            <div data-settings-partial="about-project" data-src="partials/settings/about-project.html"
                data-settings-tab="system"></div>
        </div>
        <div data-settings-partial="sidebar-footer" data-src="partials/settings/sidebar-footer.html"></div>
    </div>

    <div class="main-container">
        <div id="clock-date-wrap" class="clock-date-wrap">
            <div id="clock-fade-wrap" class="clock-fade-wrapper">
                <div id="clock">00:00:00</div>
            </div>
            <div id="date-fade-wrap" class="date-fade-wrapper">
                <div id="date">Loading date...</div>
            </div>
        </div>
        <div id="custom-title-display" class="custom-title-display"></div>

        <div id="search-container" class="search-container">
            <div class="search-engine-selector" id="search-engine-selector">
                <button type="button" class="selected-engine" id="selected-engine" title="Google" aria-label="Google"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="engine-dropdown"><img
                        class="search-engine-icon" src="https://www.google.com/s2/favicons?domain=google.com&amp;sz=64"
                        alt=""></button>
                <div class="engine-dropdown" id="engine-dropdown" role="listbox" aria-label="Search engines">
                </div>
            </div>

            <div id="image-preview-container" class="image-preview-container" style="display: none;">
                <div class="preview-wrapper">
                    <img id="image-preview-thumb" src="" alt="Preview">
                    <div id="remove-preview-btn" class="preview-remove-btn"><i class="fa-solid fa-xmark"></i></div>
                </div>
            </div>

            <form action="https://www.google.com/search" method="GET" target="_self">
                <input type="text" id="search-input" aria-label="Search" name="q" placeholder="Search Google..."
                    autocomplete="off">
            </form>
            <i class="fa-solid fa-camera camera-btn" id="search-camera-btn" title="Search by Image"></i>
            <i class="fa-solid fa-camera-viewfinder lens-btn" id="search-lens-btn"
                title="Search any image with Google Lens"></i>
            <a href="https://www.google.com/search?sourceid=chrome&udm=50&aep=42&source=chrome.crn.rb" target="_blank"
                class="ai-btn" id="search-ai-btn" title="AI Mode (Gemini)">
                <i class="fa-solid fa-star"></i>
            </a>
            <input type="file" id="image-search-upload" aria-label="Image Search Upload" accept="image/*"
                style="display: none;">
            <input type="file" id="image-lens-upload" aria-label="Image Lens Upload" accept="image/*"
                style="display: none;">
            <button type="button" class="clear-btn" id="clear-btn" title="Clear search">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <span class="search-divider" id="search-divider"></span>
            <button type="button" class="search-submit-btn" id="search-submit-btn" title="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <!-- Bookmark Widget (Fixed inline with CSS calc trick) -->
        <div class="bookmark-widget no-transition" id="bookmark-widget">
            <div id="bookmark-selection-toolbar" class="selection-toolbar" style="display: none;">
                <div class="selection-info">
                    <span id="selection-count">0</span> <span data-i18n="bookmark_selected">Selected</span>
                    <small id="selection-scope"></small>
                </div>
                <div class="selection-actions">
                    <button id="bookmark-select-all" class="selection-btn" title="Select All">
                        <i class="fa-solid fa-check-double"></i>
                    </button>
                    <button id="bookmark-group-selected" class="selection-btn" title="Group Selected">
                        <i class="fa-solid fa-folder-plus"></i>
                    </button>
                    <button id="bookmark-move-selected" class="selection-btn" title="Move Selected">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    </button>
                    <button id="bookmark-delete-selected" class="selection-btn delete" title="Delete Selected">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button id="bookmark-cancel-selection" class="selection-btn cancel" title="Cancel Selection">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div id="bookmarks-container" class="bookmarks-grid">
                <!-- Bookmarks will be injected here -->
            </div>


            <div id="bookmark-groups-container" class="bookmark-groups-container">
                <!-- Group Tabs will be injected here -->
            </div>

            <div id="bookmark-groups-toggle" class="bookmark-groups-toggle" title="Toggle Bookmark Groups">
                <i class="fa-solid fa-layer-group"></i>
            </div>
        </div>
    </div>

    <div id="full-calendar-container" style="display: none;"></div>

    <!-- Custom Context Menu -->
    <div id="context-menu" class="context-menu">
        <div class="menu-item" id="menu-favorite" style="display:none;"><i class="fa-solid fa-star"></i> <span data-i18n="menu_favorite">Favorite</span></div>
        <div class="menu-item" id="menu-select"><i class="fa-solid fa-check-to-slot"></i> <span data-i18n="menu_select">Select</span></div>
        <div class="menu-item" id="menu-move" style="display:none;"><i class="fa-solid fa-arrows-up-down"></i> <span data-i18n="menu_move_font">Move</span></div>
        <div class="menu-item" id="menu-edit"><i class="fa-solid fa-pen"></i> <span data-i18n="menu_edit">Edit</span></div>
        <div class="menu-item danger" id="menu-delete"><i class="fa-solid fa-trash"></i> <span data-i18n="menu_delete">Delete</span></div>
        <div class="menu-item" id="menu-lock" style="display:none;"><i class="fa-solid fa-lock"></i> <span data-i18n="menu_lock">Lock Position</span></div>
    </div>

    <div data-settings-partial="donate-modal" data-src="partials/modals/donate-modal.html"></div>

    <!-- Bookmark Modal -->
    <div id="bookmark-modal" class="modal">
        <div class="modal-content bookmark-modal-content">
            <div class="modal-header">
                <div class="modal-header-left">
                    <button id="back-to-manual" class="modal-back-btn" style="display:none;" aria-label="Back">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <h2 id="modal-title">Add Bookmark</h2>
                </div>
                <span id="close-modal-btn" class="close"><i class="fa-solid fa-xmark"></i></span>
            </div>

            <div class="modal-body">
                <!-- Manual Entry Form -->
                <div id="manual-entry-form" class="bookmark-modal-form">
                    <div class="modal-input-group">
                        <i class="fa-solid fa-tag modal-input-icon"></i>
                        <input type="text" id="bookmark-title" class="i18n-placeholder"
                            data-i18n-placeholder="modal_title_placeholder" placeholder="Title">
                    </div>
                    <div class="modal-input-group">
                        <i class="fa-solid fa-link modal-input-icon"></i>
                        <input type="url" id="bookmark-url" class="i18n-placeholder"
                            data-i18n-placeholder="modal_url_placeholder" placeholder="URL (e.g., https://example.com)">
                    </div>
                    <div class="modal-input-group">
                        <i class="fa-solid fa-image modal-input-icon"></i>
                        <input type="url" id="bookmark-icon-url" class="i18n-placeholder"
                            data-i18n-placeholder="modal_icon_placeholder" placeholder="Custom Icon URL (Optional)">
                    </div>
                    <div class="modal-actions" style="display: flex; gap: 12px; margin-top: 15px;">
                        <button id="save-bookmark" class="primary-btn"
                            style="flex: 1 1 0; width: 0; height: 44px; justify-content: center; gap: 10px; font-weight: 600;">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span data-i18n="modal_save">Save</span>
                        </button>
                        <button id="show-import-btn" class="secondary-btn modal-import-trigger-btn"
                            style="flex: 1 1 0; width: 0; height: 44px; justify-content: center; gap: 10px; font-weight: 600;">
                            <i class="fa-solid fa-download"></i>
                            <span data-i18n="modal_import">Import from Browser</span>
                        </button>
                    </div>
                </div>

                <!-- Import Section (Hidden by default) -->
                <div id="import-section" style="display: none;">
                    <div class="import-toolbar">
                        <div class="import-search-wrap">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="import-search" class="import-search-input"
                                data-i18n-placeholder="modal_import_search" placeholder="Search bookmarks...">
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <button id="import-toggle-folders-btn" class="secondary-btn"
                                style="padding: 4px 8px; font-size: 0.85rem;" data-i18n-title="modal_toggle_folders"
                                title="Toggle Folders">
                                <i class="fa-solid fa-folder-tree"></i>
                            </button>
                            <label class="import-select-all-label" for="import-select-all">
                                <input type="checkbox" id="import-select-all">
                                <span data-i18n="modal_select_all">Select all</span>
                            </label>
                        </div>
                    </div>
                    <div id="browser-bookmarks-list" class="bookmark-tree-container"></div>
                    <div class="import-footer"
                        style="display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08);">
                        <span id="import-count-label" class="import-count-label"
                            style="font-size: 0.9rem; opacity: 0.8; font-weight: 500;">0 selected</span>
                        <button id="confirm-import-btn" class="primary-btn"
                            style="height: 40px; padding: 0 20px; justify-content: center; gap: 10px; font-weight: 600; min-width: 160px;">
                            <i class="fa-solid fa-file-import"></i>
                            <span data-i18n="modal_import_selected">Import Selected</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div data-settings-partial="fonts-modal" data-src="partials/modals/fonts-modal.html"></div>
    <div data-settings-partial="language-modal" data-src="partials/modals/language-modal.html"></div>
    <div id="main-bg-credit" class="main-bg-credit"></div>
